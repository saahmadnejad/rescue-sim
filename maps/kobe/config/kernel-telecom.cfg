!include kernel-inline.cfg

# Telecom disaster scenario — kobe (real map, T7).
# Same opt-in gate as maps/test/config/kernel-telecom.cfg: classic configs
# (kernel.cfg, kernel-inline.cfg) are untouched (DECISIONS.md constraint 2).
# Note: maps/kobe/config/gis.cfg carries a stale absolute gis.map.dir
# ("/home/ali/maps/test/Berlin3/map"); the launcher's --gis.map.dir=$MAP
# override wins, so keep passing it (start-telecom.sh does).

# Telecom simulator: BTS load + damage (kernel.simulators.auto already
# populated by kernel-inline.cfg; append ours).
kernel.simulators.auto +: telecom.TelecomSimulator

# Comms through BTSs: swap the channel model for the BTS-gated wrapper.
kernel.communication: telecom.comms.TelecomCommunicationModel

# Scoring: RSL21 + population-coverage% composite (T5).
score.function: telecom.score.TelecomScoreFunction
telecom.score.weight.rsl21: 0.5
telecom.score.weight.coverage: 0.5

# BTS placement: 4x3 grid over the kobe map, every site inside the map.
# Coordinates are MODEL millimetres (0-based): GMLWorldModelCreator converts
# raw coordinates with ScaleConversion(map.minX, map.minY, 1000, 1000)
# (convertX = (x - minX) * scale, maps/ScaleConversion.java:27), so kobe's raw
# x -24.036..444.484 m / y 0..364.08 m becomes x 0..468520 mm /
# y 0..364080 mm (verified: the loaded world model reports exactly that box).
# Grid: dx = 468520/4 = 117130, x0 = dx/2 = 58565;
#       dy = 364080/3 = 121360, y0 = dy/2 = 60680.
# Radius rule radius ~= 0.65 * spacing (overlapping macrocells): 0.65 * 121360
# -> 80000mm. The kobe map is ~469m across in sim units, so this radius is
# sim-scaled rather than a real macrocell: the rule, not the absolute metres,
# is what carries over to larger maps (see maps/berlin).
# BTS placement: map-aware planner (see telecom.BtsGridPlanner) — site
# count from map area (telecom.bts.sites-per-km2-milli, default 8000),
# radius from cell geometry, sites snapped to building centroids.
# To pin an explicit grid instead, set e.g.:
#   telecom.bts.grid: 4,3,117130,121360,58565,60680,80000
# (grid values are model millimetres, 0-based)

# Disaster: Maria day-1 curve (95% outage).
telecom.damage.scenario: maria
# 1 kernel step = 1 simulated minute; a day = 1440 steps.
telecom.damage.steps-per-day: 1440
# Generators run 72h on tank (Maria evidence: fuel logistics binding).
telecom.damage.generator-hours: 72

# Hearing requires BTS coverage (set false to disable gating).
telecom.comms.bts-required: true

# Telecom viewer (T7, in-process): standard animated map + BTS coverage discs
# + population-coverage% readout. Reads the in-process TelecomRegistry, so it
# must be launched by the inline kernel (this cfg). The window is titled
# "Telecom viewer N" (the classic "Viewer N" has no BTS layer by design).
# Hide the layer per-viewer with viewer.standard.BTSLayer.visible: false.
kernel.viewers.auto +: telecom.view.TelecomViewerComponent

# Restoration brigade (T4): rule-based policy = paper-4 matrix row (i).
# Policy disabled by default — external work orders (v1.1) or flip this
# for the classical-baseline runs.
telecom.policy.enabled: false
telecom.policy.max-orders-per-tick: 2

# Brigade mechanics (defaults shown; times at 1440 steps/day).
telecom.brigade.cow-stock: 4
telecom.brigade.cow-setup-steps: 1440
telecom.brigade.repair-steps: 4320
telecom.brigade.refuel-steps: 720
telecom.brigade.refuel-hours: 72

# Telemetry endpoint (T6 v1.0): plain JSON REST. 0 = disabled (default);
# pick a free port to expose GET /telecom/sites|coverage|alarms and
# POST /telecom/workorders.
telecom.http.port: 0
