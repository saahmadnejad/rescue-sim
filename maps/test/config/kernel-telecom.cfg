!include kernel-inline.cfg

# Telecom disaster scenario — adds telecom on top of the inline kernel.
# Classic configs (kernel.cfg, kernel-inline.cfg) are untouched; this file
# is the opt-in gate (DECISIONS.md constraint 2).

# Telecom simulator: BTS load + damage (kernel.simulators.auto already
# populated by kernel-inline.cfg; append ours).
kernel.simulators.auto +: telecom.TelecomSimulator

# Comms through BTSs: swap the channel model for the BTS-gated wrapper.
kernel.communication: telecom.comms.TelecomCommunicationModel

# BTS placement: grid over the test map (test map spans roughly
# 0..300000mm; BTS radius 100000mm gives overlapping macrocells).
telecom.bts.grid: 3,3,100000,100000,50000,50000,100000

# Disaster: Maria day-1 curve (95% outage).
telecom.damage.scenario: maria
# 1 kernel step ≈ 1 simulated minute; a day = 1440 steps. Scale down for
# faster experiments.
telecom.damage.steps-per-day: 1440
# Generators run 72h on tank (Maria evidence: fuel logistics binding).
telecom.damage.generator-hours: 72

# Hearing requires BTS coverage (set false to disable gating).
telecom.comms.bts-required: true
