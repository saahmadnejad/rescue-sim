!include kernel-inline.cfg

# Telecom disaster scenario — adds telecom on top of the inline kernel.
# Classic configs (kernel.cfg, kernel-inline.cfg) are untouched; this file
# is the opt-in gate (DECISIONS.md constraint 2).

# Telecom simulator: BTS load + damage (kernel.simulators.auto already
# populated by kernel-inline.cfg; append ours).
kernel.simulators.auto +: telecom.TelecomSimulator

# Comms through BTSs: swap the channel model for the BTS-gated wrapper.
kernel.communication: telecom.comms.TelecomCommunicationModel

# Scoring: RSL21 + population-coverage% composite (T5).
score.function: telecom.score.TelecomScoreFunction
telecom.score.weight.rsl21: 0.5
telecom.score.weight.coverage: 0.5

# BTS placement: 3x3 grid over the test map, all sites inside the map.
# Coordinates are MODEL millimetres (0-based). GMLWorldModelCreator converts
# raw map coordinates via ScaleConversion(map.minX, map.minY, 1000, 1000) —
# convertX = (x - minX) * scale (maps/ScaleConversion.java:27) — so the raw
# x -30..135 m / y -20..121 m becomes x 0..165000 mm / y 0..141000 mm.
# Grid: dx = 165000/3 = 55000, x0 = dx/2 = 27500; dy = 141000/3 = 47000,
# y0 = dy/2 = 23500. Sites: x 27500/82500/137500, y 23500/70500/117500,
# each 27500/23500 from the map edges. Radius 35000mm (0.65 x max spacing)
# gives overlapping macrocells.
telecom.bts.grid: 3,3,55000,47000,27500,23500,35000

# Disaster: Maria day-1 curve (95% outage).
telecom.damage.scenario: maria
# 1 kernel step ≈ 1 simulated minute; a day = 1440 steps. Scale down for
# faster experiments.
telecom.damage.steps-per-day: 1440
# Generators run 72h on tank (Maria evidence: fuel logistics binding).
telecom.damage.generator-hours: 72

# Hearing requires BTS coverage (set false to disable gating).
telecom.comms.bts-required: true

# Telecom viewer (T7, in-process): standard animated map + BTS coverage discs
# + population-coverage% readout. Reads the in-process TelecomRegistry, so it
# must be launched by the inline kernel (this cfg). Classic launches are
# unaffected (SampleViewer only). Hide the layer per-viewer with
# viewer.standard.BTSLayer.visible: false.
kernel.viewers.auto: telecom.view.TelecomViewerComponent

# Restoration brigade (T4): rule-based policy = paper-4 matrix row (i).
# Enabled: automated dispatch of repair crews, fuel tankers, and COW deployment trucks.
telecom.policy.enabled: true
telecom.policy.max-orders-per-tick: 2

# Brigade mechanics: demonstration times for scenario visualization
telecom.brigade.cow-stock: 4
telecom.brigade.cow-setup-steps: 20
telecom.brigade.repair-steps: 30
telecom.brigade.refuel-steps: 15
telecom.brigade.refuel-hours: 72

# Road blockades & Autonomous Police Force:
collapse.create-road-blockages: true

# Autonomous Multi-Agent Emergency Response Team (Police, Ambulance, Fire, Centre, Restoration):
kernel.agents.auto: telecom.agent.TelecomPoliceForce*n
kernel.agents.auto +: telecom.agent.TelecomAmbulanceTeam*n
kernel.agents.auto +: telecom.agent.TelecomFireBrigade*n
kernel.agents.auto +: telecom.agent.TelecomCentre*n
kernel.agents.auto +: telecom.agent.TelecomRestorationAgent*4
kernel.agents.auto +: sample.SampleCivilian*n

# Telemetry endpoint (T6 v1.0): plain JSON REST. 0 = disabled (default);
# pick a free port to expose GET /telecom/sites|coverage|alarms and
# POST /telecom/workorders.
telecom.http.port: 0
